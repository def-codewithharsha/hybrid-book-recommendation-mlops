project: hybrid-book-recommendation
environment: development
random_seed: 42

paths:
  model: models/book_recommender.joblib
  users: data/raw/Users.csv
  books: data/raw/Books.csv
  ratings: data/raw/Ratings.csv

training:
  latent_factors: 64
  max_content_features: 100000
  popularity_prior_strength: 5.0
  content_weight: 0.35
  collaborative_weight: 0.45
  popularity_weight: 0.20

evaluation:
  relevance_threshold: 7

api:
  host: 0.0.0.0
  port: 8080
  recommendation_limit: 50

logging:
  level: INFO
  format: json

quality_gates:
  min_recall_at_10: null
